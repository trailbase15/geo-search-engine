[build-system]
requires = ["maturin>=1.6,<1.7"]
build-backend = "maturin"

[project]
name = "geo-search"
version = "0.1.0"
description = "Ultra-fast geospatial search with auto-cookie handling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "httpx>=0.26",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "black>=23.0", "ruff>=0.3"]

[tool.maturin]
features = ["python"]
module-name = "geo_search_core"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"